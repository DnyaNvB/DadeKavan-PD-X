global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: worker-a
    static_configs:
      - targets:
          - worker-a:9101

  - job_name: worker-b
    static_configs:
      - targets:
          - worker-b:9102

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
